<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E1400">

  <title>SACCO — A recipe worth sharing.</title>
  <meta name="description" content="SACCO — A recipe worth sharing.">
  <meta property="og:title" content="SACCO — A recipe worth sharing.">
  <meta property="og:description" content="A recipe worth sharing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/sacco-photo.jpg">

  <link rel="preload" href="assets/sacco-logo.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sacco-photo.jpg" as="image">
  <link rel="preload" href="assets/sacco-payoff.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="landing">
    <header class="site-header">
      <h1 class="brand">
        <img src="assets/sacco-logo.svg" alt="SACCO">
      </h1>
    </header>

    <section class="hero" aria-label="SACCO">
      <img
        class="hero__photo"
        src="assets/sacco-photo.jpg"
        alt="A child seated at a dining table with an older man."
        width="1638"
        height="2048"
      >

      <img
        class="hero__tagline"
        src="assets/sacco-payoff.svg"
        alt="A recipe worth sharing."
      >

      <a
        class="hero__instagram"
        href="https://www.instagram.com/sacco.us/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="SACCO on Instagram"
      >@sacco.us</a>
    </section>

    <div class="rule" aria-hidden="true"></div>

    <footer class="site-footer">
      <p>© SACCO 2026</p>
    </footer>
  </main>
</body>
</html>
